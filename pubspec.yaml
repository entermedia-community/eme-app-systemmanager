name: eme_app_systemmanager
description: "EME system settings: server, database, catalog parameters, users, groups and site permissions."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  collection: ^1.19.1
  eme_app_sdk:
    path: ../eme-app-sdk
  dio: ^5.11.1
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_fonts: ^6.3.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Phosphor Icons (MIT), vendored because phosphor_flutter no longer compiles; see lib/core/ph.dart.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
